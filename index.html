<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Alexander Brown</title>

  <link rel="stylesheet" href="/style.css" />

  <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap" rel="stylesheet">


  <meta name="cf-2fa-verify" content="f2IeF0SQ4E9bvgkQLKDk" />
</head>
  
<body class="w-full h-screen relative flex items-center justify-center text-white select-none">


    <!-- Fixed Home Icon -->
    <a href="#" id="home-btn" class="fixed top-8 left-8 z-50 text-white cursor-pointer opacity-0 transition-opacity hover:opacity-75 animate-bounce">
        <svg class="w-8 h-8 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
    </a>

    <!-- REVEAL SCREEN (Back Layer) -->
    <div id="reveal-screen" class="absolute inset-0 flex flex-col items-center justify-center z-10 opacity-0 scale-75 transition-all duration-1000 ease-in-out">
        <h1 class="energy-text text-4xl sm:text-6xl md:text-[10vw] font-black tracking-tighter uppercase">
            ELECTRICAL 
        </h1>
        <h1 class="text-2xl sm:text-4xl md:text-[6vw] font-black tracking-tighter uppercase">
            ENGINEERING 
        </h1>
    </div>
  


    <!-- INTRO SCREEN (Front Layer) -->
    <div id="intro-screen" class="absolute inset-0 flex flex-col items-center justify-center z-20 bg-[#0a0a0a] transition-all duration-1000 ease-in-out">
        
        <h2 class="text-3xl md:text-4xl lg:text-6xl font-light tracking-[0.2em] mb-12 text-center uppercase">
            ALEXANDER BROWN
        </h2>
        
        <div class="flex flex-col items-center animate-bounce opacity-70">
            <span class="text-xs uppercase tracking-widest mb-2 opacity-50">Scroll</span>
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
            </svg>
        </div>
        
    </div>





</body>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const introScreen = document.getElementById('intro-screen');
            const revealScreen = document.getElementById('reveal-screen');
            const homeBtn = document.getElementById('home-btn');
            let hasAnimated = false;

            // Function to trigger the animation state
            const triggerAnimation = () => {
                if (hasAnimated) return;
                hasAnimated = true;

                // Zoom away the intro
                introScreen.classList.add('zoom-away');
                
                // Reveal the energy text
                revealScreen.classList.add('reveal-in');

                homeBtn.classList.add('fade-in'); // Show home button

            };

            // Desktop: Listen for mouse wheel scroll down
            window.addEventListener('wheel', (e) => {
                if (e.deltaY > 0) { // Scrolling down
                    triggerAnimation();
                }
            });

            // Mobile/Touch: Listen for swipe up (which simulates scrolling down)
            let touchStartY = 0;
            window.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                if (!touchStartY) return;
                
                let touchCurrentY = e.touches[0].clientY;
                let swipeDistance = touchStartY - touchCurrentY;

                // If user swiped upwards by at least 30 pixels
                if (swipeDistance > 30) {
                    triggerAnimation();
                }
            });
            
            // Handle home button click to reset
            homeBtn.addEventListener('click', (e) => {
                e.preventDefault(); // Prevent default link jump
                e.stopPropagation(); // Stop the click from triggering the window click listener below
                
                if (!hasAnimated) return;
                hasAnimated = false;
                
                // Remove animation classes to revert to original state
                introScreen.classList.remove('zoom-away');
                revealScreen.classList.remove('reveal-in');
                homeBtn.classList.remove('fade-in');
            });

            // Also allow a click anywhere to trigger it just in case!
            window.addEventListener('click', () => {
                 triggerAnimation();
            });
        });
</script>

</html>
